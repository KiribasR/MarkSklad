{% load static %}
<!DOCTYPE html>
<html lang="en">
{% load pwa %}
{% progressive_web_app_meta %}
<head>
    <meta charset="UTF-8">
    <!-- Блок подстановки title в шаблон -->
    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'main/css/tsd.css' %}">
	<!--<link rel="icon"href="{% static 'main/icons/favicon.ico' %}">-->
    <style>
        /* Стили для всплывающего окна */
            .popup {
                display: none; /* Скрыто по умолчанию */
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5); /* Полупрозрачный фон */
                z-index: 1000;
            }

            .popup-content {
                position: relative;
                background-color: #fff;
                margin: 15% auto;
                padding: 20px;
                border: 1px solid #888;
                width: 80%;
                max-width: 500px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }

            .close {
                position: absolute;
                right: 10px;
                top: 5px;
                font-size: 24px;
                cursor: pointer;
            }

            .close:hover {
                color: #f00;
            }
       </style>


    
    
    
</head>
<body>

    <header class="header"> <!-- Тут должна быть лого "АТЭСКО" и название страницы в 1 строку-->
        
        <div class="header-title"> 
             {% block head %}{% endblock %}
        </div> 
    </header>
    <hr>

    <!--Всплывающее окно-->
    <!-- Всплывающее окно -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="closePopup" class="close">&times;</span>
            <p>Это всплывающее окно, созданное с помощью Django!</p>
        </div>
    </div>

    <script>
        // JavaScript для управления всплывающим окном
        const popup = document.getElementById('popup');
        const openPopupButton = document.getElementById('openPopup');
        const closePopupButton = document.getElementById('closePopup');

        // Открыть окно при нажатии на кнопку
        openPopupButton.addEventListener('click', () => {
            popup.style.display = 'block';
        });

        // Закрыть окно при нажатии на крестик
        closePopupButton.addEventListener('click', () => {
            popup.style.display = 'none';
        });

        // Закрыть окно при клике вне его области
        window.addEventListener('click', (event) => {
            if (event.target === popup) {
                popup.style.display = 'none';
            }
        });
    </script>
    <!--Конец всплывающего окна-->

    {% csrf_token %}

    <!-- Основной контент подставляемый в шаблон-->
    {% block content %}
    {% endblock %}
    

<!-- футер с навигацией по страницам в одну строку-->
<footer>
    <div class="footer-container">
        <nav class="bottom-nav">
            <a href="{% url 'tsd:index' %}" ><img class="icons" src="{% static 'main/icons/search.png' %}"> На главную</a>
            <a href="#search"><img class="icons" src="{% static 'main/icons/db_insert.png' %}">Поиск</a>
            <a href="{% url 'palletizing:mainPallet' %}"><img class="icons" src="{% static 'main/icons/db_insert.png' %}">Паллетирование</a>
            <a href="{% url 'modifying:mainModify' %}"><img class="icons" src="{% static 'main/icons/agregate.png' %}">Редактирование</a>
        </nav>
    </div>
</footer>
</body>
</html>
